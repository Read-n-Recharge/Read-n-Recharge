version: "3.9"

services:
  frontend:
    image: readnrechargefrontend
    container_name: readnrecharge-front
    ports:
      - "80:80"

  backend:
    build:
      context: .
    container_name: readnrecharge-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - frontend